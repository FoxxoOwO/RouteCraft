[workspace]
resolver = "2"
members = [
    "crates/routecraft-core",
    "crates/routecraft-cli",
    "crates/routecraft-protocols",
    "crates/routecraft-engine",
    "crates/routecraft-wasm",
    "apps/web/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RouteCraft Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/routecraft/routecraft"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
